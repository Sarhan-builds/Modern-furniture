<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Lumina Furniture | Pakistan's Largest Premium Furniture Collection</title>
    <meta name="description" content="Pakistan's largest premium furniture collection. Factory direct pricing, custom-made furniture, and nationwide delivery. Shop living room, bedroom, dining, and office furniture." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://luminafurniture.pk/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lumina Furniture" />
    <meta property="og:title" content="Lumina Furniture | Pakistan's Largest Premium Furniture Collection" />
    <meta property="og:description" content="Factory direct pricing, custom-made furniture, and nationwide delivery across Pakistan. Premium quality bedroom, living room, dining & office furniture." />
    <meta property="og:url" content="https://luminafurniture.pk/" />
    <meta property="og:image" content="https://luminafurniture.pk/og-image.jpg" />
    <meta property="og:locale" content="en_PK" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lumina Furniture | Pakistan's Largest Premium Furniture Collection" />
    <meta name="twitter:description" content="Factory direct pricing, custom-made furniture, and nationwide delivery across Pakistan." />
    <meta name="twitter:image" content="https://luminafurniture.pk/og-image.jpg" />

    <!-- Structured Data: Organization + LocalBusiness -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FurnitureStore",
      "name": "Lumina Furniture",
      "url": "https://luminafurniture.pk",
      "logo": "https://luminafurniture.pk/logo.png",
      "description": "Pakistan's largest premium furniture collection offering factory-direct pricing, custom-made furniture, and nationwide delivery.",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "PK",
        "addressRegion": "Punjab"
      },
      "areaServed": {
        "@type": "Country",
        "name": "Pakistan"
      },
      "priceRange": "PKR",
      "knowsAbout": [
        "Bedroom Furniture",
        "Living Room Furniture",
        "Dining Room Furniture",
        "Office Furniture",
        "Custom Furniture",
        "Premium Furniture Pakistan"
      ],
      "sameAs": []
    }
    </script>

    <!-- Structured Data: WebSite + SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Lumina Furniture",
      "url": "https://luminafurniture.pk",
      "description": "Pakistan's largest premium furniture collection with factory direct pricing and nationwide delivery.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://luminafurniture.pk/?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
